<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <title>M3U Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#0f1115; --panel:#161922; --text:#e8eaed; --accent:#4f8cff; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; }
    .sidebar { width:280px; background:var(--panel); border-right:1px solid #222636; display:flex; flex-direction:column; }
    .main { flex:1; display:flex; flex-direction:column; }
    .topbar { padding:12px 16px; border-bottom:1px solid #222636; display:flex; align-items:center; gap:10px; }
    .channel-list { flex:1; overflow:auto; }
    .channel-item { padding:10px 14px; border-bottom:1px solid #1f2333; cursor:pointer; font-size:14px; }
    .channel-item:hover { background:#1c2133; }
    .channel-item.active { background:#1f2a4a; border-left:3px solid var(--accent); }
    .video-wrap { flex:1; background:#000; display:flex; align-items:center; justify-content:center; }
    video { width:100%; height:100%; max-height:100vh; }
    .empty-state { text-align:center; opacity:.7; }
    .file-input { display:none; }
    .btn { background:var(--accent); color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:14px; }
    .btn.secondary { background:#23283a; }
    .status { font-size:12px; opacity:.8; margin-left:auto; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
</head>
<body>
  <div class="sidebar">
    <div class="topbar">
      <button class="btn" id="uploadBtn">上傳 M3U</button>
      <input class="file-input" id="fileInput" type="file" accept=".m3u,.m3u8" />
      <div class="status" id="status"></div>
    </div>
    <div class="channel-list" id="channelList"></div>
  </div>
  <div class="main">
    <div class="video-wrap">
      <video id="video" controls></video>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const channelList = document.getElementById('channelList');
    const video = document.getElementById('video');
    const status = document.getElementById('status');

    let channels = [];
    let hls = null;

    uploadBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = '載入中...';
      const text = await file.text();
      channels = parseM3U(text);
      renderChannels();
      status.textContent = `已載入 ${channels.length} 個頻道`;
    });

    function parseM3U(content) {
      const lines = content.split(/\r?\n/);
      const result = [];
      let current = null;
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) continue;
        if (line.startsWith('#EXTINF:')) {
          const meta = line.slice(8);
          const parts = meta.split(',');
          const name = parts.slice(1).join(',').trim() || parts[0].trim();
          current = { name, url: '' };
        } else if (!line.startsWith('#') && current) {
          current.url = line;
          result.push(current);
          current = null;
        }
      }
      return result;
    }

    function renderChannels() {
      channelList.innerHTML = '';
      if (channels.length === 0) {
        channelList.innerHTML = '<div class="empty-state" style="padding:16px">未偵測到頻道</div>';
        return;
      }
      channels.forEach((ch, idx) => {
        const div = document.createElement('div');
        div.className = 'channel-item';
        div.textContent = ch.name || `Channel ${idx + 1}`;
        div.dataset.index = idx;
        div.addEventListener('click', () => {
          document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
          div.classList.add('active');
          playChannel(ch.url);
        });
        channelList.appendChild(div);
      });
    }

    function playChannel(url) {
      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => video.play().catch(()=>{}), { once: true });
      } else {
        alert('你的瀏覽器不支援 HLS 播放');
      }
    }
  </script>
</body>
</html>
